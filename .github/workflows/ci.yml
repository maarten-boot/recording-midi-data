name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # python-rtmidi ships wheels for 3.10 - 3.12 on all three systems (none for 3.13 yet)
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # the same checks as `make check`, called directly so Windows needs no make
      - name: ruff check
        run: ruff check midi_recorder.py midi_recorder_gui.py tests stubs

      - name: ruff format --check
        run: ruff format --check midi_recorder.py midi_recorder_gui.py tests stubs

      - name: mypy --strict
        run: mypy midi_recorder.py midi_recorder_gui.py tests

      - name: pytest
        run: pytest

  package:
    name: build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist + wheel and check the metadata
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
