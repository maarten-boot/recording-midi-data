# Publish to PyPI when a GitHub release is published, using PyPI "trusted publishing" (OIDC): no API token is stored anywhere.
#
# Releasing:
#   1. bump __version__ in midi_recorder.py, commit, push
#   2. on GitHub: Releases -> Draft a new release -> tag v<version> (e.g. v0.1.0) -> Publish release
#   3. this workflow runs the checks, builds the sdist + wheel and uploads them to PyPI
# A manual run (Actions -> Release -> Run workflow) uploads to TestPyPI instead; every upload needs a new version number.
#
# One-time setup, on both https://pypi.org and https://test.pypi.org (Account -> Publishing -> add a pending publisher):
#   PyPI project name: midi-recorder     Owner: maarten-boot     Repository: recording-midi-data
#   Workflow name: release.yml           Environment: pypi (on PyPI)  /  testpypi (on TestPyPI)
# and on GitHub (Settings -> Environments) create the environments "pypi" and "testpypi".
# On "pypi" you can add yourself as a required reviewer, so every release waits for your click.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: checks and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Release tag matches __version__
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' midi_recorder.py)
          echo "tag=$TAG  __version__=$VERSION"
          if [ -z "$VERSION" ] || { [ "$TAG" != "v$VERSION" ] && [ "$TAG" != "$VERSION" ]; }; then
            echo "::error::release tag '$TAG' does not match __version__ '$VERSION' (expected 'v$VERSION')"
            exit 1
          fi

      - name: ruff check
        run: ruff check midi_recorder.py midi_recorder_gui.py tests stubs

      - name: ruff format --check
        run: ruff format --check midi_recorder.py midi_recorder_gui.py tests stubs

      - name: mypy --strict
        run: mypy midi_recorder.py midi_recorder_gui.py tests

      - name: pytest
        run: pytest

      - name: Build sdist + wheel
        run: python -m build

      - name: twine check
        run: twine check --strict dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/midi-recorder
    permissions:
      id-token: write # trusted publishing; only this job gets it
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-testpypi:
    name: publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/midi-recorder
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
