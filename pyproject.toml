[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "midi-recorder"
dynamic = ["version"]  # single source: __version__ in midi_recorder.py
description = "Record all incoming MIDI events to timestamped .mid files, saved automatically when playing stops"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maarten Boot" }]
keywords = ["midi", "recorder", "piano", "mido", "daw"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
    "mido>=1.3",
    "python-rtmidi>=1.5.8",
]

[project.optional-dependencies]
dev = [
    "build",
    "mypy",
    "pytest",
    "ruff",
    "twine",
]

[project.urls]
Homepage = "https://github.com/maarten-boot/recording-midi-data"
Issues = "https://github.com/maarten-boot/recording-midi-data/issues"

[project.scripts]
midi-recorder = "midi_recorder:main"

[project.gui-scripts]
midi-recorder-gui = "midi_recorder_gui:main"

[tool.hatch.version]
path = "midi_recorder.py"

[tool.hatch.build.targets.wheel]
include = ["midi_recorder.py", "midi_recorder_gui.py"]

[tool.hatch.build.targets.sdist]
include = ["midi_recorder.py", "midi_recorder_gui.py", "tests", "stubs", "Makefile", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF", "G", "LOG"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
pretty = true
mypy_path = "stubs"
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
